<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policy — EasyBali.Surf</title>
<meta name="description" content="Privacy Policy for EasyBali.Surf — how we collect and use personal data for surf, kite, wing foil and SUP coaching bookings in Bali.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://easybali.surf/privacy-policy.html">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%0A%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'14'%20fill%3D'%2308100d'%2F%3E%0A%3Cdefs%3E%3ClinearGradient%20id%3D'g'%20x1%3D'0'%20y1%3D'0'%20x2%3D'0'%20y2%3D'1'%3E%0A%3Cstop%20offset%3D'0%25'%20stop-color%3D'%2361C9E6'%2F%3E%3Cstop%20offset%3D'100%25'%20stop-color%3D'%238CFFC1'%2F%3E%0A%3C%2FlinearGradient%3E%3C%2Fdefs%3E%0A%3Ctext%20x%3D'32'%20y%3D'19'%20font-family%3D'Plus%20Jakarta%20Sans%2C%20Arial%2C%20sans-serif'%20font-weight%3D'800'%20font-size%3D'13.5'%20text-anchor%3D'middle'%20fill%3D'url(%23g)'%20letter-spacing%3D'-0.3'%3EEASY%3C%2Ftext%3E%0A%3Ctext%20x%3D'32'%20y%3D'32.5'%20font-family%3D'Plus%20Jakarta%20Sans%2C%20Arial%2C%20sans-serif'%20font-weight%3D'800'%20font-size%3D'13.5'%20text-anchor%3D'middle'%20fill%3D'url(%23g)'%20letter-spacing%3D'-0.3'%3EBALI%3C%2Ftext%3E%0A%3Ccircle%20cx%3D'14.5'%20cy%3D'42.1'%20r%3D'2'%20fill%3D'%23ffffff'%2F%3E%0A%3Ctext%20x%3D'37'%20y%3D'46'%20font-family%3D'Plus%20Jakarta%20Sans%2C%20Arial%2C%20sans-serif'%20font-weight%3D'800'%20font-size%3D'13.5'%20text-anchor%3D'middle'%20fill%3D'%23ffffff'%20letter-spacing%3D'-0.3'%3ESURF%3C%2Ftext%3E%0A%3C%2Fsvg%3E">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Oswald:wght@400;500;600;700&amp;family=Audiowide&amp;family=Righteous&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<script src="./i18n.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="brand.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--eb-bg);color:#FFFFFFBD;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#61FFD0;text-decoration:none}
  a:hover{color:#8affe0}
  ::selection{background:#61FFD0;color:#08100d}
  h2{font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;color:#fff;font-size:22px;margin:44px 0 12px}
  p,li{font-size:15px;line-height:1.7}
  li{margin-bottom:8px}
</style>
</helmet>

<div style="position:relative;min-height:100vh">

  <header style="border-bottom:1px solid rgba(97,255,208,.12)">
    <div style="max-width:840px;margin:0 auto;padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
      <a href="{{ backHref }}" style="display:flex;align-items:center;color:#fff">
        <eb-logo size="19px" animated="false"></eb-logo>
      </a>
      <a href="{{ backHref }}" style="font-size:14px;color:#FFFFFFBD">{{ t.backLink }}</a>
    </div>
  </header>

  <main style="max-width:720px;margin:0 auto;padding:70px 32px 100px">
    <p style="font-family:'Inter',sans-serif;color:#61FFD0;font-size:14px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;margin:0">{{ t.eyebrow }}</p>
    <h1 style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:clamp(30px,5vw,44px);line-height:1.05;letter-spacing:-.5px;color:#fff;margin:14px 0 0">{{ t.h1 }}</h1>
    <p style="font-size:14px;color:#FFFFFF80;margin:10px 0 0">{{ t.updated }}</p>

    <p style="margin-top:28px;max-width:64ch">{{ t.intro }}</p>

    <sc-for list="{{ t.sections }}" as="s" hint-placeholder-count="10">
      <div>
        <h2>{{ s.h }}</h2>
        <sc-if value="{{ s.body }}" hint-placeholder-val="{{ true }}"><p>{{ s.body }}<sc-if value="{{ s.contactEmail }}" hint-placeholder-val="{{ false }}"> <a href="mailto:hello@easybali.surf">hello@easybali.surf</a></sc-if></p></sc-if>
        <sc-if value="{{ s.list }}" hint-placeholder-val="{{ false }}">
          <ul>
            <sc-for list="{{ s.list }}" as="li" hint-placeholder-count="4"><li>{{ li }}</li></sc-for>
          </ul>
        </sc-if>
      </div>
    </sc-for>
  </main>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // Language is never chosen on this page — it's inherited from whichever site
  // language the visitor was on when they clicked through (via ?lang= on the link).
  urlLang() {
    const v = typeof window !== 'undefined' ? new URLSearchParams(window.location.search).get('lang') : null;
    return (window.PRIVACY_TEXT && window.PRIVACY_TEXT[v]) ? v : 'en';
  }
  renderVals() {
    const lang = this.urlLang();
    if (typeof document !== 'undefined') document.documentElement.lang = lang;
    const D = window.PRIVACY_TEXT || {};
    const t = D[lang] || D.en;
    return {
      t,
      backHref: 'index.html?lang=' + lang,
    };
  }
}

</script>
</body>
</html>
