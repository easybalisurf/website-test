<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our commitment — EasyBali.Surf</title>
<meta name="description" content="How EasyBali.surf gives back to Bali's ocean and respects its culture.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://easybali.surf/commitment.html">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Oswald:wght@400;500;600;700&amp;family=Righteous&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<script src="./i18n.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="brand.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--eb-bg);color:#FFFFFFBD;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#61FFD0;text-decoration:none}
  a:hover{color:#8affe0}
  ::selection{background:#61FFD0;color:#08100d}
</style>
</helmet>

<div style="position:relative;min-height:100vh">

  <header style="border-bottom:1px solid rgba(97,255,208,.12)">
    <div style="max-width:960px;margin:0 auto;padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
      <a href="{{ backHref }}" style="display:flex;align-items:center;color:#fff">
        <eb-logo size="24px" animated="false"></eb-logo>
      </a>
      <a href="{{ backHref }}" style="font-size:14px;color:#FFFFFFBD">{{ backLabel }}</a>
    </div>
  </header>

  <main style="max-width:900px;margin:0 auto;padding:70px 32px 100px">
    <div style="max-width:680px">
      <p style="font-family:'Inter',sans-serif;color:#61FFD0;font-size:14px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;margin:0">{{ care.sub }}</p>
      <h1 style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.5px;color:#fff;margin:14px 0 0">{{ care.h2 }}</h1>
      <p style="font-size:16px;line-height:1.7;margin:22px 0 0;max-width:62ch">{{ care.lead }}</p>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:20px;margin-top:52px">
      <sc-for list="{{ items }}" as="c" hint-placeholder-count="3">
        <div style="display:flex;flex-direction:column;padding:30px 26px;border:1px solid rgba(97,255,208,.16);border-radius:18px;background:rgba(255,255,255,.05)">
          <h3 style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:23px;color:#fff;margin:0 0 10px;line-height:1.12">{{ c.title }}</h3>
          <p style="font-size:15px;line-height:1.65;margin:0;flex:1;color:#FFFFFFCC">{{ c.body }}</p>
          <sc-if value="{{ c.hasLink }}" hint-placeholder-val="{{ false }}">
            <a href="{{ c.href }}" target="_blank" rel="noopener" style="margin-top:16px;font-size:14px;font-weight:600;color:#61FFD0;width:max-content" style-hover="color:#8affe0">{{ c.link }} →</a>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </main>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  urlLang() {
    const v = typeof window !== 'undefined' ? new URLSearchParams(window.location.search).get('lang') : null;
    return (window.SITE_TEXT && window.SITE_TEXT[v]) ? v : 'en';
  }
  renderVals() {
    const lang = this.urlLang();
    if (typeof document !== 'undefined') document.documentElement.lang = lang;
    const S = window.SITE_TEXT || {};
    const t = S[lang] || S.en || {};
    const care = t.care || { sub:'', h2:'', lead:'', items:[] };
    return {
      care,
      items: (care.items || []).map(it => ({ ...it, hasLink: !!it.href })),
      backHref: 'Bali Surf Booking.dc.html?lang=' + lang,
      backLabel: lang === 'ru' ? '← Назад на сайт' : '← Back to site',
    };
  }
}
</script>
</body>
</html>
