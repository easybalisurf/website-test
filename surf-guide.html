<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bali Surf Guide — Waves, Wind & Best Spots | EasyBali.Surf</title>
<meta name="description" content="Guide to Bali's best surf, kite and SUP spots — wave types, wind patterns, tides and seasonality to help you plan your session.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://easybali.surf/surf-guide.html">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%0A%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'14'%20fill%3D'%2308100d'%2F%3E%0A%3Cdefs%3E%3ClinearGradient%20id%3D'g'%20x1%3D'0'%20y1%3D'0'%20x2%3D'0'%20y2%3D'1'%3E%0A%3Cstop%20offset%3D'0%25'%20stop-color%3D'%2361C9E6'%2F%3E%3Cstop%20offset%3D'100%25'%20stop-color%3D'%238CFFC1'%2F%3E%0A%3C%2FlinearGradient%3E%3C%2Fdefs%3E%0A%3Ctext%20x%3D'32'%20y%3D'19'%20font-family%3D'Plus%20Jakarta%20Sans%2C%20Arial%2C%20sans-serif'%20font-weight%3D'800'%20font-size%3D'13.5'%20text-anchor%3D'middle'%20fill%3D'url(%23g)'%20letter-spacing%3D'-0.3'%3EEASY%3C%2Ftext%3E%0A%3Ctext%20x%3D'32'%20y%3D'32.5'%20font-family%3D'Plus%20Jakarta%20Sans%2C%20Arial%2C%20sans-serif'%20font-weight%3D'800'%20font-size%3D'13.5'%20text-anchor%3D'middle'%20fill%3D'url(%23g)'%20letter-spacing%3D'-0.3'%3EBALI%3C%2Ftext%3E%0A%3Ccircle%20cx%3D'14.5'%20cy%3D'42.1'%20r%3D'2'%20fill%3D'%23ffffff'%2F%3E%0A%3Ctext%20x%3D'37'%20y%3D'46'%20font-family%3D'Plus%20Jakarta%20Sans%2C%20Arial%2C%20sans-serif'%20font-weight%3D'800'%20font-size%3D'13.5'%20text-anchor%3D'middle'%20fill%3D'%23ffffff'%20letter-spacing%3D'-0.3'%3ESURF%3C%2Ftext%3E%0A%3C%2Fsvg%3E">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Oswald:wght@400;500;600;700&amp;family=Audiowide&amp;family=Righteous&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<script src="./i18n.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="brand.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--eb-bg);color:#FFFFFFBD;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#61FFD0;text-decoration:none}
  a:hover{color:#8affe0}
  ::selection{background:#61FFD0;color:#08100d}
  @keyframes floatUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
</style>
</helmet>

<div style="position:relative;min-height:100vh">

  <header style="border-bottom:1px solid rgba(97,255,208,.12)">
    <div style="max-width:840px;margin:0 auto;padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
      <a href="{{ backHref }}" style="display:flex;align-items:center;color:#fff">
        <eb-logo size="19px" animated="false"></eb-logo>
      </a>
      <a href="{{ backHref }}" style="font-size:14px;color:#FFFFFFBD">{{ t.backLink }}</a>
    </div>
  </header>

  <main style="max-width:760px;margin:0 auto;padding:80px 32px 100px">
    <p style="font-family:'Inter',sans-serif;color:#61FFD0;font-size:14px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;margin:0;animation:floatUp .7s ease-out both">{{ t.eyebrow }}</p>
    <h1 style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:clamp(34px,6vw,54px);line-height:1.02;letter-spacing:-.5px;color:#fff;margin:14px 0 0;animation:floatUp .8s .06s ease-out both">{{ t.h1 }}</h1>
    <p style="font-size:17px;line-height:1.7;margin:22px 0 0;max-width:62ch;animation:floatUp .9s .12s ease-out both">{{ t.lead }}</p>

    <section style="margin-top:56px;animation:floatUp 1s .16s ease-out both">
      <h2 style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:26px;color:#fff;margin:0 0 16px">{{ t.sizeTitle }}</h2>
      <div style="display:flex;flex-direction:column;gap:14px">
        <sc-for list="{{ t.sizes }}" as="sz" hint-placeholder-count="3">
          <div style="padding:20px 22px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)">
            <strong style="color:#61FFD0">{{ sz.strong }}</strong><span style="color:#fff"> — {{ sz.tag }}</span> {{ sz.body }}
          </div>
        </sc-for>
      </div>
    </section>

    <section style="margin-top:48px;animation:floatUp 1s .2s ease-out both">
      <h2 style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:26px;color:#fff;margin:0 0 16px">{{ t.windTitle }}</h2>
      <p style="font-size:15px;line-height:1.7;margin:0 0 16px;max-width:62ch">
        <sc-for list="{{ windSegs }}" as="seg" hint-placeholder-count="7"><span style="{{ seg.style }}">{{ seg.t }}</span></sc-for>
      </p>
    </section>

    <section style="margin-top:48px;animation:floatUp 1s .24s ease-out both">
      <h2 style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:26px;color:#fff;margin:0 0 16px">{{ t.swellTitle }}</h2>
      <p style="font-size:15px;line-height:1.7;margin:0;max-width:62ch">
        <sc-for list="{{ swellSegs }}" as="seg" hint-placeholder-count="5"><span style="{{ seg.style }}">{{ seg.t }}</span></sc-for>
      </p>
    </section>

    <section style="margin-top:48px;animation:floatUp 1s .28s ease-out both">
      <h2 style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:26px;color:#fff;margin:0 0 16px">{{ t.spotsTitle }}</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px">
        <sc-for list="{{ spots }}" as="sp" hint-placeholder-count="6">
          <div style="{{ sp.cardStyle }}"><strong style="color:#fff">{{ sp.name }}</strong><br><span style="font-size:14px">{{ sp.desc }}</span></div>
        </sc-for>
      </div>
    </section>

    <section style="margin-top:48px;animation:floatUp 1s .32s ease-out both">
      <h2 style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;font-size:26px;color:#fff;margin:0 0 16px">{{ t.seasonTitle }}</h2>
      <p style="font-size:15px;line-height:1.7;margin:0 0 16px;max-width:62ch">
        <sc-for list="{{ seasonDrySegs }}" as="seg" hint-placeholder-count="2"><span style="{{ seg.style }}">{{ seg.t }}</span></sc-for>
      </p>
      <p style="font-size:15px;line-height:1.7;margin:0;max-width:62ch">
        <sc-for list="{{ seasonWetSegs }}" as="seg" hint-placeholder-count="2"><span style="{{ seg.style }}">{{ seg.t }}</span></sc-for>
      </p>
    </section>

    <a href="{{ ctaHref }}" style="display:inline-flex;align-items:center;gap:9px;background:linear-gradient(120deg,#7DFFC4,#61FFD0 42%,#3FD9E6);color:#08100d;font-weight:600;font-size:15px;padding:16px 30px;border-radius:100px;margin-top:56px;animation:floatUp 1s .36s ease-out both">{{ t.cta }}</a>
  </main>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // Language is never chosen on this page — it's inherited from whichever site
  // language the visitor was on when they clicked through (via ?lang= on the link).
  urlLang() {
    const v = typeof window !== 'undefined' ? new URLSearchParams(window.location.search).get('lang') : null;
    return (window.GUIDE_TEXT && window.GUIDE_TEXT[v]) ? v : 'en';
  }
  segStyle(seg) { return seg.b ? 'color:#fff;font-weight:600' : ''; }
  renderVals() {
    const lang = this.urlLang();
    if (typeof document !== 'undefined') document.documentElement.lang = lang;
    const D = window.GUIDE_TEXT || {};
    const t = D[lang] || D.en;
    return {
      t,
      spots: (t.spots || []).map(sp => {
        const c = sp.diff === 'adv' ? '#ec6a5e' : sp.diff === 'int' ? '#f2c14e' : '#46d17a';
        const tint = sp.diff === 'adv' ? 'rgba(236,106,94,.10)' : sp.diff === 'int' ? 'rgba(242,193,78,.10)' : 'rgba(70,209,122,.10)';
        return { ...sp, cardStyle: 'padding:18px 20px 18px 22px;border-radius:14px;background:' + tint + ';border:1px solid rgba(255,255,255,.1);border-left:4px solid ' + c };
      }),
      windSegs: (t.windBody || []).map(seg => ({ ...seg, style: this.segStyle(seg) })),
      swellSegs: (t.swellBody || []).map(seg => ({ ...seg, style: this.segStyle(seg) })),
      seasonDrySegs: (t.seasonDry || []).map(seg => ({ ...seg, style: this.segStyle(seg) })),
      seasonWetSegs: (t.seasonWet || []).map(seg => ({ ...seg, style: this.segStyle(seg) })),
      backHref: 'index.html?lang=' + lang,
      ctaHref: 'index.html?lang=' + lang + '#forecast',
    };
  }
}

</script>
</body>
</html>
